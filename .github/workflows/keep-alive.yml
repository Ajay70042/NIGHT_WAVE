name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -s -f "https://nightwave-api-r6i8.onrender.com/api/health" || echo "Ping failed or server waking up"
